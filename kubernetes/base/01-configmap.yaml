apiVersion: v1
kind: ConfigMap
metadata:
  name: fdp-config
  namespace: financial-data-platform
data:
  APP_ENV: development
  AWS_REGION: us-east-1
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres.airflow.svc.cluster.local/airflow

