version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: dim_account
    columns:
      - name: account_id
        tests: [not_null, unique]
  - name: fct_transactions
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: transaction_amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
  - name: fct_daily_balances
    columns:
      - name: balance_id
        tests: [not_null, unique]
  - name: mart_regulatory_reconciliation
    columns:
      - name: debit_credit_difference
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: net_flow_imbalance_ratio
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 0.75

exposures:
  - name: quicksight_financial_performance
    type: dashboard
    maturity: medium
    owner:
      name: Data Platform Team
      email: data-platform@example.com
    depends_on:
      - ref('mart_financial_performance')
  - name: quicksight_customer_risk
    type: dashboard
    maturity: medium
    owner:
      name: Data Platform Team
      email: data-platform@example.com
    depends_on:
      - ref('mart_customer_risk')
  - name: quicksight_regulatory_reconciliation
    type: dashboard
    maturity: medium
    owner:
      name: Data Platform Team
      email: data-platform@example.com
    depends_on:
      - ref('mart_regulatory_reconciliation')
