name: Main Branch Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Lint
        run: make lint

      - name: Type check
        run: make type-check

      - name: Tests
        run: make test

  build-artifacts:
    name: Build Validated Artifacts
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Generate synthetic data
        run: make generate-data

      - name: Build release bundle
        run: ./scripts/build_release_bundle.sh

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: financial-data-platform-bundle
          path: dist/financial-data-platform-bundle.tgz

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ vars.AWS_REGION != '' && vars.AWS_ROLE_TO_ASSUME != '' }}
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Prepare terraform.tfvars
        run: cp terraform/environments/dev/terraform.tfvars.example terraform/environments/dev/terraform.tfvars

      - name: Terraform init
        run: terraform -chdir=terraform/environments/dev init

      - name: Terraform validate
        run: terraform -chdir=terraform/environments/dev validate

      - name: Terraform plan
        run: terraform -chdir=terraform/environments/dev plan -var-file=terraform.tfvars -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: terraform/environments/dev/tfplan

  deploy-application-code:
    name: Deploy Application Code
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
      - terraform-plan
    if: ${{ vars.AWS_REGION != '' && vars.AWS_ROLE_TO_ASSUME != '' && vars.APP_DEPLOY_BUCKET != '' }}
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: financial-data-platform-bundle
          path: dist

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload application bundle
        run: aws s3 cp dist/financial-data-platform-bundle.tgz s3://${{ vars.APP_DEPLOY_BUCKET }}/releases/${{ github.sha }}.tgz

