services:
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  platform-dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
      - ${HOME}/.aws:/root/.aws:ro
    command: bash -lc "sleep infinity"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: >
      bash -lc "rm -f /opt/airflow/airflow-webserver.pid &&
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com || true &&
      airflow webserver"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow:/opt/airflow
      - ./:/workspace
      - ${HOME}/.aws:/home/airflow/.aws:ro

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: >
      bash -lc "airflow db migrate &&
      airflow scheduler"
    volumes:
      - ./airflow:/opt/airflow
      - ./:/workspace
      - ${HOME}/.aws:/home/airflow/.aws:ro

  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    working_dir: /workspace/dbt_financial
    env_file:
      - .env
    volumes:
      - ./:/workspace
      - ${HOME}/.aws:/root/.aws:ro

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
    command: bash -lc "make validate-all"

volumes:
  airflow-postgres-data:
